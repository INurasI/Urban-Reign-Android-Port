plugins {
    id "com.android.application"
}

android {
    namespace "kz.nurasql77.urbanreign"
    compileSdk 35

    defaultConfig {
        applicationId "kz.nurasql77.urbanreign"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}
