name: Prepare Urban Reign generated game code (manual only)

on:
  workflow_dispatch:
    inputs:
      boot_elf_url:
        description: "HTTPS link to a small SLUS_212.09 executable (not the ISO); leave blank to use the secret."
        required: false
        type: string
      iso_url:
        description: "HTTPS link to your ISO; Actions requests only the byte ranges containing SLUS_212.09 and refuses hosts that ignore Range."
        required: false
        type: string
permissions:
  contents: read

# Only the latest source change should generate the reusable game-code artifact.
concurrency:
  group: urban-reign-prepare-main
  cancel-in-progress: true

jobs:
  generate-game-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Android port repository
        uses: actions/checkout@v4

      - name: Checkout Urban Reign Recomp v1.3.0
        uses: actions/checkout@v4
        with:
          repository: thiagordsfx/urban-reign-recomp
          ref: v1.3.0
          path: source

      - name: Build host-side PS2 recompiler
        shell: bash
        run: |
          set -euo pipefail
          cmake -S source/runtime/ps2xRecomp -B build/host-recomp \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-recomp --target ps2_recomp --parallel 2
          test -x build/host-recomp/ps2_recomp
          # The upstream generator only searches tools/ps2_recomp.exe. It runs this Linux
          # binary normally; the suffix is just the upstream script's hard-coded filename.
          install -D -m 0755 build/host-recomp/ps2_recomp source/tools/ps2_recomp.exe
          test -x source/tools/ps2_recomp.exe

      - name: Select and verify SLUS_212.09 without downloading the full ISO
        shell: bash
        env:
          BOOT_ELF_URL: ${{ inputs.boot_elf_url || secrets.URBAN_BOOT_ELF_URL }}
          ISO_URL: ${{ inputs.iso_url || secrets.URBAN_ISO_RANGE_URL }}
        run: |
          set -euo pipefail
          if [ -s "$GITHUB_WORKSPACE/SLUS_212.09" ]; then
            install -D -m 0600 "$GITHUB_WORKSPACE/SLUS_212.09" "$RUNNER_TEMP/SLUS_212.09"
            echo "Using repository-provided SLUS_212.09; the generator will verify its SHA-256 before compiling."
          elif [ -n "$BOOT_ELF_URL" ]; then
            echo "::add-mask::$BOOT_ELF_URL"
            python3 urban-reign-android/patches/fetch_boot_elf.py \
              --elf-url "$BOOT_ELF_URL" --output "$RUNNER_TEMP/SLUS_212.09"
          elif [ -n "$ISO_URL" ]; then
            echo "::add-mask::$ISO_URL"
            python3 urban-reign-android/patches/fetch_boot_elf.py \
              --iso-url "$ISO_URL" --output "$RUNNER_TEMP/SLUS_212.09"
          else
            echo "No repository boot executable or download URL found. Add SLUS_212.09 from your own USA copy, or provide boot_elf_url/iso_url." >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/SLUS_212.09"
          sha256sum "$RUNNER_TEMP/SLUS_212.09"
          du -h "$RUNNER_TEMP/SLUS_212.09"
      - name: Generate native C++ from the verified boot ELF
        shell: bash
        run: |
          set -euo pipefail
          python3 urban-reign-android/patches/generate_from_elf.py --source source --elf "$RUNNER_TEMP/SLUS_212.09"
          test -s source/generated/register_functions.cpp
          test -s source/generated/ps2_recompiled_functions.h
          echo "Generated code from the verified boot ELF; the ISO was never transferred to Actions."
      - name: Archive generated game code
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/urban-reign-generated-code.tar.gz" -C source generated
          test -s "${RUNNER_TEMP}/urban-reign-generated-code.tar.gz"
          du -h "${RUNNER_TEMP}/urban-reign-generated-code.tar.gz"

      - name: Upload reusable generated game code
        uses: actions/upload-artifact@v4
        with:
          name: Urban-Reign-generated-code
          path: ${{ runner.temp }}/urban-reign-generated-code.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup boot ELF
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/SLUS_212.09"
