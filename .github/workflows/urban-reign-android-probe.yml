name: Urban Reign Android ARM64 host portability probe (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-arm64-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Android port workspace
        uses: actions/checkout@v4

      - name: Checkout Urban Reign Recomp v1.3.0
        uses: actions/checkout@v4
        with:
          repository: thiagordsfx/urban-reign-recomp
          ref: v1.3.0
          path: source

      - name: Validate ELF-only build tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile urban-reign-android/patches/*.py
          python3 urban-reign-android/patches/test_fetch_boot_elf.py
          python3 urban-reign-android/patches/test_folder_disc_support.py
          python3 urban-reign-android/patches/test_cd_read_patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("urban-reign-android/tools/extract-boot-elf.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if not match:
              raise SystemExit("The local ISO-to-ELF helper has no inline script")
          Path("${{ runner.temp }}/extract-boot-elf.js").write_text(match.group(1), encoding="utf-8")
          print("Python scripts compile; local browser extraction script found.")
          PY
          node --check "$RUNNER_TEMP/extract-boot-elf.js"
          grep -q 'fetch_boot_elf.py' .github/workflows/urban-reign-prepare-game-code.yml
          grep -q 'fetch_boot_elf.py' .github/workflows/urban-reign-android-apk.yml
          grep -q 'iso_url:' .github/workflows/urban-reign-prepare-game-code.yml
          grep -q 'iso_url:' .github/workflows/urban-reign-android-apk.yml
          ! grep -E 'curl .*ISO_URL|wget .*ISO_URL' \
            .github/workflows/urban-reign-prepare-game-code.yml \
            .github/workflows/urban-reign-android-apk.yml
          echo "Both code-generation paths avoid transferring the full ISO to GitHub Actions."
      - name: Locate runner-provided Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -x "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" || \
            test -x "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/16.0/bin/sdkmanager"

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "ndk;27.2.12479018" "cmake;3.31.6"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Fetch ARM NEON implementation for x86 SIMD intrinsics
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/DLTcollab/sse2neon.git third_party/sse2neon
          test -f third_party/sse2neon/sse2neon.h

      - name: Verify upstream revision and Android target assumptions
        shell: bash
        run: |
          set -euo pipefail
          git -C source describe --tags --exact-match
          grep -q 'if(ANDROID)' source/runtime/ps2xRuntime/CMakeLists.txt
          grep -q 'add_subdirectory(ps2xRuntime)' source/runtime/CMakeLists.txt
          grep -q 'add_subdirectory(ps2xIOP)' source/runtime/CMakeLists.txt
          grep -q 'USE_SSE2NEON' source/runtime/ps2xRuntime/include/ps2_runtime.h
          grep -q 'USE_SSE2NEON' source/runtime/ps2xRuntime/include/runtime/ps2_memory.h

      - name: Build host-side PS2 recompilation tool
        shell: bash
        run: |
          set -euo pipefail
          cmake -S source/runtime/ps2xRecomp -B build/host-recomp \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-recomp --target ps2_recomp --parallel 2
          test -x build/host-recomp/ps2_recomp
          build/host-recomp/ps2_recomp --help || true

      - name: Prepare game-host portability compile probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/src/CMakeLists.txt")
          lines = p.read_text().splitlines()
          option = 'option(URBAN_ANDROID_HOST_PROBE "Compile Urban Reign host sources without generated game code" OFF)'
          if option not in lines:
              idx = next((i for i, line in enumerate(lines) if line.startswith("set(URBAN_RUNTIME_INCLUDE ")), None)
              if idx is None:
                  raise SystemExit("Could not find runtime include marker in src/CMakeLists.txt")
              lines.insert(idx + 1, option)

          old = 'if(NOT EXISTS "${URBAN_GENERATED_DIR}/register_functions.cpp")'
          new = 'if(NOT EXISTS "${URBAN_GENERATED_DIR}/register_functions.cpp" AND NOT (ANDROID AND URBAN_ANDROID_HOST_PROBE))'
          if old in lines:
              lines[lines.index(old)] = new
          elif new not in lines:
              raise SystemExit("Could not guard generated-code requirement for Android host probe")

          if not any("add_library(urban_host_android_probe SHARED" in line for line in lines):
              try:
                  idx = lines.index("    urban/thread_policy.cpp") + 2
              except ValueError:
                  raise SystemExit("Could not locate the end of URBAN_HOST_SOURCES")
              branch = [
                  "",
                  "if(ANDROID AND URBAN_ANDROID_HOST_PROBE)",
                  "    add_library(urban_host_android_probe SHARED ${URBAN_HOST_SOURCES} ${CMAKE_SOURCE_DIR}/runtime/ps2xRuntime/src/runner/register_functions.cpp)",
                  "    target_include_directories(urban_host_android_probe PRIVATE",
                  '        "${CMAKE_CURRENT_SOURCE_DIR}"',
                  '        "${URBAN_GENERATED_DIR}"',
                  '        "${CMAKE_SOURCE_DIR}/modsdk/include"',
                  '        "${CMAKE_SOURCE_DIR}/runtime/ps2xRuntime/src/lib"',
                  "    )",
                  "    target_link_libraries(urban_host_android_probe PRIVATE ps2_runtime)",
                  '    target_link_options(urban_host_android_probe PRIVATE "-Wl,--undefined=ANativeActivity_onCreate")',
                  "    target_compile_definitions(urban_host_android_probe PRIVATE",
                  '        URBAN_ARCH_NAME="ARM64"',
                  "        URBAN_HAS_VU1_PROGRAMS=0",
                  "    )",
                  "    return()",
                  "endif()",
                  "",
              ]
              lines[idx:idx] = branch

          p.write_text("\n".join(lines) + "\n")
          print("Prepared compile-only Android target for Urban Reign host sources")
          PY

      - name: Configure runtime-only ARM64 build
        shell: bash
        run: |
          set -euo pipefail
          # Configure the runtime and compile-only host-source portability target.
          cmake -S source -B build/android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_static \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-DUSE_SSE2NEON -I$GITHUB_WORKSPACE/third_party/sse2neon" \
            -DURBAN_DEBUG_UI=OFF \
            -DURBAN_FFMPEG=OFF \
            -DURBAN_PCSX2_GS=OFF \
            -DURBAN_ANDROID_HOST_PROBE=ON \
            -DURBAN_BUILD_MODS=OFF \
            -DURBAN_BUILD_MOD_EXAMPLE=OFF \
            -DURBAN_BUILD_RECOMP=OFF \
            -DURBAN_BUILD_TOOLS=OFF \
            -DPS2X_ENABLE_SCCACHE=OFF \
            -DPS2X_ENABLE_RUNTIME_LOGS=OFF

      - name: Apply Android host, ISO picker and touch-input patches
        shell: bash
        run: |
          set -euo pipefail
          python3 urban-reign-android/patches/apply_android_port.py source

      - name: Compile Android native runner and reusable runtime libraries for ARM64
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/android-arm64 --target ps2EntryRunner urban_host_android_probe --parallel 2

      - name: Verify ARM64 NativeActivity library
        shell: bash
        run: |
          set -euo pipefail
          LIB="build/android-arm64/runtime/ps2xRuntime/libps2EntryRunner.so"
          test -s "$LIB"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$READELF" -h "$LIB" | tee build/android-arm64/runner-elf-header.txt
          grep -q 'AArch64' build/android-arm64/runner-elf-header.txt
          "$NM" -D "$LIB" | tee build/android-arm64/runner-dynamic-symbols.txt
          grep -q 'ANativeActivity_onCreate' build/android-arm64/runner-dynamic-symbols.txt
          echo "Verified arm64-v8a runtime NativeActivity entry point."
          "$READELF" -d "$LIB" | tee build/android-arm64/runner-needed-libraries.txt
          if grep -q 'libc++_shared.so' build/android-arm64/runner-needed-libraries.txt; then
            echo "Unexpected libc++_shared dependency; APK must bundle that runtime." >&2
            exit 1
          fi

          HOST="build/android-arm64/src/liburban_host_android_probe.so"
          test -s "$HOST"
          "$READELF" -h "$HOST" | tee build/android-arm64/host-elf-header.txt
          grep -q 'AArch64' build/android-arm64/host-elf-header.txt
          "$NM" -D "$HOST" | tee build/android-arm64/host-dynamic-symbols.txt
          grep -q 'ANativeActivity_onCreate' build/android-arm64/host-dynamic-symbols.txt
          grep -q 'Java_kz_nurasql77_urbanreign_MainActivity_nativeSetAppStoragePath' build/android-arm64/host-dynamic-symbols.txt
          grep -q 'Java_kz_nurasql77_urbanreign_MainActivity_nativeSetIsoPath' build/android-arm64/host-dynamic-symbols.txt
          grep -q 'Java_kz_nurasql77_urbanreign_MainActivity_nativeTouchButton' build/android-arm64/host-dynamic-symbols.txt
          grep -q 'Java_kz_nurasql77_urbanreign_MainActivity_nativeTouchAxis' build/android-arm64/host-dynamic-symbols.txt
          echo "Verified actual Android host probe exports NativeActivity and all four JNI bridge methods."
          "$READELF" -d "$HOST" | tee build/android-arm64/host-needed-libraries.txt
          if grep -q 'libc++_shared.so' build/android-arm64/host-needed-libraries.txt; then
            echo "Unexpected libc++_shared dependency in Android host probe." >&2
            exit 1
          fi

      - name: Set up JDK 17 for Android UI smoke test
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Gradle for Android UI smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.11.1/bin/gradle" --version

      - name: Compile Android Activity and resources
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugJavaWithJavac \
            :app:processDebugMainManifest \
            -p urban-reign-android/android-app
          echo "Android Java Activity and manifest compile successfully."

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-reign-android-arm64-runtime-host-recompiler
          path: |
            build/android-arm64/CMakeCache.txt
            build/android-arm64/CMakeFiles/CMakeConfigureLog.yaml
            build/android-arm64/runtime/ps2xRuntime/libps2EntryRunner.so
            build/android-arm64/runner-elf-header.txt
            build/android-arm64/runner-dynamic-symbols.txt
            build/android-arm64/host-elf-header.txt
            build/android-arm64/host-dynamic-symbols.txt
            build/android-arm64/runner-needed-libraries.txt
            build/android-arm64/host-needed-libraries.txt
            build/host-recomp/ps2_recomp
            build/host-recomp/help.txt
            build/android-arm64/src/liburban_host_android_probe.so
            build/host-recomp/ps2_recomp
          if-no-files-found: ignore
          retention-days: 7
