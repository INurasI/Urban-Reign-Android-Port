name: Urban Reign APK (without native library)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-java-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Confirm this APK will not include native libraries
        shell: bash
        run: |
          set -euo pipefail
          rm -f urban-reign-android/android-app/app/src/main/jniLibs/arm64-v8a/liburban.so
          test ! -e urban-reign-android/android-app/app/src/main/jniLibs/arm64-v8a/liburban.so

      - name: Build Java and Android resources only
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug -p urban-reign-android/android-app
          APK="urban-reign-android/android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/.*\.so'; then
            echo "::error::Unexpected native library found in APK"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p build/apk
          cp "$APK" build/apk/UrbanReign-Android-no-native-debug.apk

      - name: Upload APK without native library
        uses: actions/upload-artifact@v4
        with:
          name: Urban-Reign-Android-no-native
          path: build/apk/UrbanReign-Android-no-native-debug.apk
          if-no-files-found: error
          retention-days: 14
