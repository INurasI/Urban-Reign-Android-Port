name: Urban Reign Android UI Java compile check

on:
  push:
    branches: [main]
    paths:
      - "urban-reign-android/android-app/app/src/main/java/**"
      - "urban-reign-android/android-app/app/src/main/AndroidManifest.xml"
      - "urban-reign-android/android-app/app/build.gradle"
      - "urban-reign-android/android-app/build.gradle"
      - "urban-reign-android/android-app/settings.gradle"
      - ".github/workflows/urban-reign-android-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate runner-provided Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || test -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install pinned Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Compile Java and process Android resources
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:processDebugResources :app:compileDebugJavaWithJavac -p urban-reign-android/android-app
